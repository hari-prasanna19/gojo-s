<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./src/output.css">

    <title>GoJo's</title>
    <!-- Tailwindcss cdn -->

    <!-- fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
</head>

<body class="bg-black">
    <!-- topsection -->
    <section id="topsec" class="bg-black relative text-sm gap-1 md:text-xl">
        <div class="flex justify-center items-center text-white p-3 gap-2">
            <p>Sign up & get</p>
            <p class="text-yellow-400 font-bold">50%</p>
            <p>OFF on your First order</p>
        </div>
        <p id="closetop"
            class="absolute top-5.5 right-4 -translate-y-1/2 text-white cursor-pointer hover:text-gray-300 font-bold text-sm md:text-xl">
            X
        </p>
    </section>
    <!-- Responsive navbar -->
    <nav
        class=" bg-gradient-to-r from-black via-red-900 to-black text-gray-300 p-2 flex items-center justify-between shadow-xl sticky top-0 z-10">
        <svg id="menuicon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="32"
            height="32" class="cursor-pointer ml-5 md:hidden text-gray-300">
            <path fill-rule="evenodd"
                d="M3 6.75A.75.75 0 0 1 3.75 6h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 6.75ZM3 12a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75A.75.75 0 0 1 3 12Zm0 5.25a.75.75 0 0 1 .75-.75h16.5a.75.75 0 0 1 0 1.5H3.75a.75.75 0 0 1-.75-.75Z"
                clip-rule="evenodd" />
        </svg>
        <a href="index.html">
        <h1
            class=" bg-gradient-to-r from-red-500 via-white to-red-500 bg-clip-text text-transparent font-extrabold text-5xl tracking-wide cursor-pointer">
            GoJo's</h1></a>


        <ul class="gap-5 text-gray-300 marker:text-red-500 hidden md:flex">
            <li>
                <a class="cursor-pointer hover:text-red-500 transition-colors duration-300 font-medium"
                    href="index.html">Home</a>
            </li>
            <li>
                <a class="cursor-pointer hover:text-red-500 transition-colors duration-300 font-medium"
                    href="products.html">Products</a>
            </li>
            <li>
                <a class="cursor-pointer hover:text-red-500 transition-colors duration-300 font-medium"
                    href="signup.html">Sign Up</a>
            </li>
        </ul>
    </nav>
    <!-- Sidenav -->
    <section id="sidenav"
        class="bg-gradient-to-r from-black via-red-900 to-black text-gray-300 fixed z-20 top-0 transition-all duration-1000"
        style="width:50%; height:100vh; left:-50%;">
        <div class="p-8 text-right">
            <p id="closenav" class="inline cursor-pointer">X</p>
        </div>
        <ul class="flex flex-col items-center gap-10 text-gray-500">
            <li>
                <a class="cursor-pointer hover:text-red-500 transition-colors duration-300 font-medium"
                    href="index.html">Home</a>
            </li>
            <li>
                <a class="cursor-pointer hover:text-red-500 transition-colors duration-300 font-medium"
                    href="products.html">Products</a>
            </li>
            <li>
                <a class="cursor-pointer hover:text-red-500 transition-colors duration-300 font-medium"
                    href="signup.html">Sign Up</a>
            </li>
            
        </ul>
    </section>
    <!-- sign Up section -->
<!-- sign Up section -->
<section id="signup" class="text-gray-300 flex flex-col items-center justify-center p-8 min-h-screen">
    <div class="grid grid-cols-1 gap-3 w-full max-w-md mx-auto">
        <h1 class="text-2xl sm:text-3xl font-semibold text-center mb-2">Sign Up</h1>

        <input type="text" name="name" placeholder="Enter Your Name" id="signinname" 
            class="border border-red-700 bg-transparent outline-none p-3 text-gray-300 placeholder-gray-500 focus:border-red-500 transition-colors duration-300 w-full">
        <input type="email" name="email" placeholder="Enter Your Mail" id="signinmail"
            class="border border-red-700 bg-transparent outline-none p-3 text-gray-300 placeholder-gray-500 focus:border-red-500 transition-colors duration-300 w-full">
        <input type="password" name="password" placeholder="Enter Your Password" id="signinpass"
            class="border border-red-700 bg-transparent outline-none p-3 text-gray-300 placeholder-gray-500 focus:border-red-500 transition-colors duration-300 w-full">

        <button id="signinsubmit" 
            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 rounded-lg shadow-lg shadow-red-600/30 transition-all duration-300 hover:scale-105 mt-2">
            Submit
        </button>

        <p class="text-center">Already a Member? Try <span id="logintext" class="font-bold text-lg text-red-500 cursor-pointer">Login</span></p>
    </div>
</section>

<!-- log in section -->
<section id="login" class="text-gray-300 flex flex-col items-center justify-center p-8 min-h-screen hidden">
    <div class="grid grid-cols-1 gap-3 w-full max-w-md mx-auto">
        <h1 class="text-2xl sm:text-3xl font-semibold text-center mb-2">Login</h1>

        <input type="email" name="email" placeholder="Enter Your Mail" id="loginmail"
            class="border border-red-700 bg-transparent outline-none p-3 text-gray-300 placeholder-gray-500 focus:border-red-500 transition-colors duration-300 w-full">
        <input type="password" name="password" placeholder="Enter Your Password" id="loginpass" 
            class="border border-red-700 bg-transparent outline-none p-3 text-gray-300 placeholder-gray-500 focus:border-red-500 transition-colors duration-300 w-full">

        <button id="loginsubmit" 
            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 rounded-lg shadow-lg shadow-red-600/30 transition-all duration-300 hover:scale-105 mt-2">
            Login
        </button>

        <p class="text-center">Not You? Then <span id="signintext" class="font-bold text-lg text-red-500 cursor-pointer">Signup</span></p>
    </div>
</section>

    <!-- //footer -->
    <section class="text-center p-5 bg-gradient-to-r from-black via-red-900 to-black text-gray-300">
        <h1
            class="bg-gradient-to-r from-red-500 via-white to-red-500 bg-clip-text p-3 text-transparent font-extrabold text-4xl md:text-5xl tracking-wide">
            GoJo's</h1>
        <p class="text-gray-300 mb-2">There is Neither Beginning Nor End</p>
        <p class="text-red-500 font-bold  tracking-widest text-sm mb-3">ONLY US</p>
        <p class="text-gray-300 mb-3">@ 2026 GoJo's.com</p>
    </section>
    <script src="signup.js"></script>
</body>
</html>
